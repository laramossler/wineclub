<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Wine Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1a1614; height: 100%; }
  body {
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  * { box-sizing: border-box; }
  .stage { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  /* page transitions */
  @keyframes wcFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .wc-fade { animation: wcFade .28s ease both; }
  /* mobile — fill the viewport, drop the showcase chrome */
  @media (max-width: 900px) {
    body { display: block; }
    .stage { padding: 0; min-height: 100vh; min-height: 100dvh; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="proto-screens.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "regular",
  "iconStyle": "hand"
}/*EDITMODE-END*/;

const D = window.DIRECTIONS;
const { BottleMark, Flourish, SmallCaps, HandIcon, Tag } = window.WC;
const S = window.WC.proto;

// Cellar Book is the base; Salon's typography is borrowed inside the salon route.
const baseDir = D.cellarBook;
const salonDir = {
  ...D.cellarBook,
  display: D.salon.display,    // EB Garamond italic
  body: D.salon.body,          // EB Garamond
};

function useIsMobile(bp = 900) {
  const get = () => typeof window !== 'undefined' && window.innerWidth <= bp;
  const [m, setM] = React.useState(get);
  React.useEffect(() => {
    const onR = () => setM(get());
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);
  return m;
}

function Phone({ children, onBack, dir, route, mobile }) {
  if (mobile) {
    return (
      <div style={{
        width: '100vw', height: '100vh', height: '100dvh',
        background: dir.bg, position: 'relative', overflow: 'hidden',
      }}>
        <div key={route} className="wc-fade" style={{ position: 'absolute', inset: 0 }}>
          {children}
        </div>
      </div>
    );
  }
  const W = 390, H = 800;
  return (
    <div style={{
      width: W, height: H, flexShrink: 0,
      borderRadius: 56, padding: 10,
      background: '#0c0a08',
      boxShadow: '0 60px 120px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04)',
      position: 'relative',
    }}>
      <div style={{
        width: '100%', height: '100%',
        borderRadius: 46, overflow: 'hidden', position: 'relative',
        background: dir.bg,
      }}>
        {/* dynamic island */}
        <div style={{
          position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)',
          width: 110, height: 32, background: '#0c0a08', borderRadius: 999, zIndex: 30,
        }}/>
        {/* status bar */}
        <div style={{
          position: 'absolute', top: 16, left: 28, right: 28, zIndex: 25,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          fontFamily: '-apple-system, system-ui', fontSize: 14, fontWeight: 600,
          color: dir.ink,
        }}>
          <span>9:41</span>
          <span style={{ display: 'flex', gap: 5, alignItems: 'center', fontSize: 11 }}>
            <span>●●●</span>
          </span>
        </div>
        {/* page */}
        <div key={route} className="wc-fade" style={{ position: 'absolute', inset: 0, paddingTop: 54 }}>
          {children}
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// App shell — owns route, density, iconStyle, member-side state
// ─────────────────────────────────────────────────────────────
function App() {
  const [t, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const mobile = useIsMobile();
  const [route, setRoute] = React.useState({ name: 'home' });
  const [pickedFlavors, setPickedFlavors] = React.useState(new Set(['bright fruit', 'spice & smoke', 'funky & wild']));
  const [privateNote, setPrivateNote] = React.useState('');
  const [composeMsg, setComposeMsg] = React.useState('');
  const [raised, setRaised] = React.useState({});

  // dir for the current route — Salon borrows Salon typography
  const dir = (route.name === 'salon' || route.name === 'thread') ? salonDir : baseDir;

  const cfg = { dir, density: t.density, iconStyle: t.iconStyle };

  const go = (r) => setRoute(r);
  const back = () => setRoute({ name: 'home' });

  let body;
  if (route.name === 'home')      body = <S.Home {...cfg} go={go} />;
  else if (route.name === 'wines') body = <S.MyWines {...cfg} go={go} />;
  else if (route.name === 'detail') body = <S.WineDetail {...cfg} bottleId={route.id} go={go} privateNote={privateNote} setPrivateNote={setPrivateNote} />;
  else if (route.name === 'salon') body = <S.SalonIndex {...cfg} go={go} />;
  else if (route.name === 'thread') body = <S.SalonThread {...cfg} threadId={route.id} go={go} raised={raised} setRaised={setRaised} />;
  else if (route.name === 'note')  body = <S.Note {...cfg} go={go} composeMsg={composeMsg} setComposeMsg={setComposeMsg} />;
  else if (route.name === 'profile') body = <S.Profile {...cfg} go={go} pickedFlavors={pickedFlavors} setPickedFlavors={setPickedFlavors} />;

  if (mobile) {
    return (
      <div className="stage">
        <Phone dir={dir} route={route.name + (route.id || '')} mobile>
          {body}
          <S.TabBar dir={dir} route={route.name} go={go} iconStyle={t.iconStyle} />
        </Phone>
      </div>
    );
  }

  return (
    <div className="stage">
      {/* prototype container w/ side info */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 56, color: '#857A6E',
        fontFamily: '"Cormorant Garamond", serif',
      }}>
        {/* left descriptor */}
        <div style={{ width: 280, color: '#C2B6A8' }}>
          <div style={{
            fontFamily: '"IBM Plex Mono", monospace', fontSize: 10,
            letterSpacing: '0.16em', textTransform: 'uppercase', color: '#857A6E',
          }}>
            Prototype · v1
          </div>
          <h1 style={{
            fontFamily: '"Cormorant Garamond", serif', fontWeight: 400, fontStyle: 'italic',
            fontSize: 38, lineHeight: 1.05, margin: '14px 0 0', color: '#F0E8DD', letterSpacing: '-0.01em',
          }}>
            The Wine Club
          </h1>
          <div style={{ marginTop: 18, fontFamily: '"Cormorant Garamond", serif', fontSize: 16, lineHeight: 1.55, color: '#C2B6A8' }}>
            Cellar Book is the base — warm cream, deep wine, Cormorant. Step into the Salon and the type quiets into EB Garamond, like opening a printed magazine after closing a letter.
          </div>
          <div style={{
            marginTop: 28, padding: '14px 0', borderTop: '0.5px solid rgba(240,232,221,0.1)', borderBottom: '0.5px solid rgba(240,232,221,0.1)',
          }}>
            <div style={{ fontFamily: '"IBM Plex Mono", monospace', fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: '#857A6E', marginBottom: 8 }}>
              Try this
            </div>
            <ol style={{ margin: 0, paddingLeft: 18, fontFamily: '"Cormorant Garamond", serif', fontSize: 14, fontStyle: 'italic', color: '#C2B6A8', lineHeight: 1.7 }}>
              <li>Tap a bottle on Home</li>
              <li>Open the Salon — feel the type shift</li>
              <li>Raise a glass on a thread</li>
              <li>Leave a note for Jacqui</li>
            </ol>
          </div>
          <div style={{ marginTop: 18, fontFamily: '"IBM Plex Mono", monospace', fontSize: 10, letterSpacing: '0.12em', color: '#5a4f44' }}>
            currently · /{route.name}{route.id ? '/' + route.id : ''}
          </div>
        </div>

        {/* phone */}
        <Phone dir={dir} route={route.name + (route.id || '')}>
          {body}
          {/* tab bar — pinned outside the page so it persists */}
          <S.TabBar dir={dir} route={route.name} go={go} iconStyle={t.iconStyle} />
        </Phone>
      </div>

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label="Display" />
        <window.TweakRadio
          label="Density" value={t.density}
          options={['compact', 'regular', 'comfy']}
          onChange={(v) => setTweak('density', v)}
        />
        <window.TweakRadio
          label="Icon style" value={t.iconStyle}
          options={['hand', 'clean']}
          onChange={(v) => setTweak('iconStyle', v)}
        />
        <window.TweakSection label="Jump to" />
        {[
          ['home', 'Home · Spring allocation'],
          ['wines', 'My Wines'],
          ['salon', 'The Salon'],
          ['note', 'Note to Jacqui'],
          ['profile', 'Taste profile'],
        ].map(([k, label]) => (
          <window.TweakButton key={k} label={label} onClick={() => go({ name: k })} />
        ))}
      </window.TweaksPanel>
    </div>
  );
}

function mount() {
  if (!window.useTweaks || !window.WC || !window.WC.proto || !window.DIRECTIONS) {
    return setTimeout(mount, 30);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
mount();
</script>
</body>
</html>
